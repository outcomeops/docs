site_name: OutcomeOps AI Assist Docs
site_url: https://docs.outcomeops.ai
site_description: Documentation for OutcomeOps AI Assist -- self-hosted, regulated-grade AI code assistant.
site_author: OutcomeOps
repo_url: https://github.com/outcomeops/docs
repo_name: outcomeops/docs
edit_uri: edit/main/docs/

# Bind mkdocs serve to all interfaces on port 8123 so the docs are
# reachable from the workstation's LAN / SSH-tunneled clients without
# colliding with whatever's on the default :8000.
dev_addr: '0.0.0.0:8123'

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  # Palette color names must come from the Material preset list. We pick
  # "custom" so the exact tailwind sky-palette hexes land via
  # docs/stylesheets/brand.css (see extra_css below).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

plugins:
  - search
  - tags

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/outcomeops
      name: OutcomeOps on GitHub
    - icon: fontawesome/solid/globe
      link: https://outcomeops.ai
      name: outcomeops.ai
    - icon: fontawesome/solid/life-ring
      link: https://outcomeops.atlassian.net/servicedesk/customer/portal/1
      name: Support Portal

# Navigation. Add pages under docs/ then reference here.
nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Deploy: getting-started/deploy.md
      - First Workspace: getting-started/first-workspace.md
  - Integrations:
      - integrations/index.md
      - GitHub: integrations/github.md
      - Azure DevOps: integrations/azure-devops.md
      - Jira: integrations/jira.md
      - Confluence: integrations/confluence.md
      - Microsoft 365: integrations/microsoft-365.md
      - Database: integrations/database.md
      - ServiceNow: integrations/servicenow.md
  - Features:
      - features/index.md
      - Chat: features/chat.md
      - Workspaces: features/workspaces.md
      - MCP Servers: features/mcp-servers.md
      - Code Generation: features/code-generation.md
  - Administration:
      - administration/index.md
      - Integration Gating: administration/integration-gating.md
      - Global Workspaces: administration/global-workspaces.md
      - PII Redaction: administration/pii-redaction.md
      - Model Selection: administration/model-selection.md
      - High Availability: administration/high-availability.md
      - SIEM Audit Stream: administration/audit-stream-export.md
      - Security Scanner Endpoint: administration/security-scanner.md
  - FAQ: faq.md
